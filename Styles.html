<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
  body {
    font-family: "Inter", sans-serif;
  }
  .tab-active {
    border-bottom: 2px solid #2563eb;
    color: #2563eb;
    font-weight: 600;
  }
  /* Destaque suave nos campos editáveis ao passar o mouse ou focar */
  [contenteditable="true"]:hover {
    outline: 1px dashed #93c5fd;
    border-radius: 4px;
  }
  [contenteditable="true"]:focus {
    outline: 2px solid #2563eb;
    border-radius: 4px;
    background-color: #eff6ff;
    color: #1e293b; /* Força o texto a ficar escuro ao editar qualquer campo */
  }
  /* Animação de spinner para indicar loading */
  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
  .animate-spin-fast {
    animation: spin 0.8s linear infinite;
  }
  /* Progress bar no topo da página */
  @keyframes progress-bar-stripes {
    from {
      background-position: 0 0;
    }
    to {
      background-position: 40px 0;
    }
  }
  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 50%, #7c3aed 100%);
    background-size: 40px 40px;
    box-shadow: 0 0 10px rgba(124, 58, 237, 0.6);
    animation: progress-bar-stripes 0.5s linear infinite;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s ease;
    width: 0%;
  }
  #progress-bar.visible {
    opacity: 1;
  }
</style>
